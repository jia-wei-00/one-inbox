# Builds a signed release APK on every push to main and publishes it as a GitHub release.
# Each release bumps the minor version of the newest vX.Y.Z tag (see scripts/next-version.sh);
# bump the major by pushing a vN.0.0 tag by hand. The run number (+100) is the versionCode.
#
# Repository secrets:
#   RELEASE_KEYSTORE_BASE64  - base64 of the release .jks
#   RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  # SHA-256 fingerprint of the release signing certificate (public; not a secret).
  RELEASE_CERT_SHA256: 37b8493ea776b9ac5241d7cd35a4f14834ddfac31810cb224c9b9d3ae87042b6

# Each release bumps the previous tag, so runs go one at a time and never cancel mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # A workflow_dispatch from another branch must not publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Compute version
        run: |
          set -euo pipefail
          version=$(bash scripts/next-version.sh)
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          # run_number is per workflow: renaming/recreating release.yml resets it, which would
          # lower versionCode below installed builds. Raise the +100 offset if that ever happens.
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          echo "Releasing v$version"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Verify APK signature and signer
        run: |
          set -euo pipefail
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          out=$("${bt}apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk)
          actual=$(printf '%s\n' "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ': \r' | tr 'A-F' 'a-f')
          expected=$(printf '%s' "$RELEASE_CERT_SHA256" | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK signer SHA-256 ($actual) does not match the release certificate ($expected)."
            exit 1
          fi
          echo "Signer matches the release certificate."

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          apk="one-inbox-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            # Re-run of an already released commit: refresh its file.
            gh release upload "v${VERSION_NAME}" "$apk" --clobber
          else
            gh release create "v${VERSION_NAME}" "$apk" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION_NAME}" \
              --generate-notes
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
