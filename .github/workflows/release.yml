# Builds a signed release APK on every push to main and publishes it as a GitHub release.
# Each release bumps the minor version of the newest vX.Y.Z tag (see scripts/next-version.sh);
# bump the major by pushing a vN.0.0 tag by hand. The run number (+100) is the versionCode.
#
# Repository secrets:
#   RELEASE_KEYSTORE_BASE64  - base64 of the release .jks
#   RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# Each release bumps the previous tag, so runs go one at a time and never cancel mid-publish.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Compute version
        run: |
          version=$(bash scripts/next-version.sh)
          echo "VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$(( ${{ github.run_number }} + 100 ))" >> "$GITHUB_ENV"
          echo "Releasing v$version"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing; refusing to publish an unsigned APK."
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test and build signed release APK
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)
          "${bt}apksigner" verify app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="one-inbox-v${VERSION_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          if gh release view "v${VERSION_NAME}" >/dev/null 2>&1; then
            # Re-run of an already released commit: refresh its file.
            gh release upload "v${VERSION_NAME}" "$apk" --clobber
          else
            gh release create "v${VERSION_NAME}" "$apk" \
              --target "$GITHUB_SHA" \
              --title "v${VERSION_NAME}" \
              --generate-notes
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
